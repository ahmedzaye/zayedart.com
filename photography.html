<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Photography — Zayed Art</title>

    <meta
        name="description"
        content="A visual archive of street photography, heritage, architecture, and places across Egypt and the UAE by Zayed Art."
    >

    <meta
        name="keywords"
        content="Zayed Art, Photography, Street Photography, Alexandria, Cairo, Matrouh, UAE"
    >

    <meta name="author" content="Zayed Art">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Main Website CSS -->
    <link rel="stylesheet" href="css/main.css">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">


    <!-- =====================================================
         PHOTOGRAPHY PAGE STYLES
         ===================================================== -->

    <style>

        /* =====================================================
           PAGE
           ===================================================== */

        .za-photo-page {
            min-height: 100vh;
            background: var(--za-bg);
        }


        /* =====================================================
           TOP BAR
           ===================================================== */

        .za-photo-topbar {
            width: 100%;
            padding: 1.5rem 2rem;

            display: flex;
            align-items: center;
            justify-content: space-between;

            border-bottom: 1px solid var(--za-border-subtle);
        }

        .za-photo-brand {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.5rem;
            letter-spacing: .1em;

            color: var(--za-dark);
        }

        .za-photo-brand span {
            color: var(--za-accent);
        }

        .za-photo-back {
            display: inline-flex;
            align-items: center;
            gap: .5rem;

            padding: .55rem 1rem;

            border: 1px solid var(--za-dark);
            border-radius: 4px;

            color: var(--za-dark);

            font-family: 'JetBrains Mono', monospace;
            font-size: .7rem;
            font-weight: 600;

            letter-spacing: .08em;
            text-transform: uppercase;

            transition: all .2s;
        }

        .za-photo-back:hover {
            background: var(--za-dark);
            color: var(--za-accent);

            transform: translateY(-1px);
        }


        /* =====================================================
           HERO
           ===================================================== */

        .za-photo-hero {
            position: relative;
            overflow: hidden;

            padding: 7rem 2rem 5rem;

            border-bottom: 1px solid var(--za-border-subtle);
        }

        .za-photo-hero-grid {
            position: absolute;
            inset: 0;

            background-image:
                linear-gradient(#191A2318 1px, transparent 1px),
                linear-gradient(90deg, #191A2318 1px, transparent 1px);

            background-size: 60px 60px;

            -webkit-mask-image:
                radial-gradient(80% 80%, #000 30%, transparent 100%);

            mask-image:
                radial-gradient(80% 80%, #000 30%, transparent 100%);

            pointer-events: none;
        }

        .za-photo-hero-glow {
            position: absolute;

            top: 50%;
            right: 10%;

            width: 500px;
            height: 400px;

            transform: translateY(-50%);

            background:
                radial-gradient(
                    var(--za-accent-soft),
                    transparent 70%
                );

            pointer-events: none;
        }

        .za-photo-hero-inner {
            position: relative;

            max-width: var(--za-max-width);
            margin: 0 auto;
        }

        .za-photo-label {
            display: flex;
            align-items: center;
            gap: .75rem;

            margin-bottom: 1rem;

            color: var(--za-dark);

            font-family: 'JetBrains Mono', monospace;
            font-size: .7rem;

            letter-spacing: .2em;
            text-transform: uppercase;
        }

        .za-photo-label::after {
            content: "";

            width: 40px;
            height: 1px;

            background: var(--za-dark);
            opacity: .5;
        }

        .za-photo-title {
            font-family: 'Bebas Neue', sans-serif;

            font-size: clamp(70px, 12vw, 150px);
            line-height: .85;

            letter-spacing: .02em;

            color: var(--za-black);
        }

        .za-photo-title span {
            color: var(--za-accent);

            text-shadow:
                2px 2px 0 var(--za-black);
        }

        .za-photo-intro {
            max-width: 650px;

            margin-top: 2rem;

            color: var(--za-text-muted);

            font-size: 18px;
            line-height: 1.7;
        }


        /* =====================================================
           GALLERY SECTION
           ===================================================== */

        .za-photo-gallery-section {
            max-width: var(--za-max-width);

            margin: 0 auto;

            padding: 4rem 2rem 7rem;
        }


        /* =====================================================
           FILTERS
           ===================================================== */

        .za-photo-filters {
            display: flex;
            flex-wrap: wrap;
            gap: .6rem;

            margin-bottom: 3rem;
        }

        .za-photo-filter {
            appearance: none;

            padding: .65rem 1rem;

            background: transparent;

            border: 1px solid rgba(25, 26, 35, .35);
            border-radius: 4px;

            color: var(--za-dark);

            font-family: 'JetBrains Mono', monospace;
            font-size: .7rem;
            font-weight: 600;

            letter-spacing: .08em;
            text-transform: uppercase;

            cursor: pointer;

            transition: all .2s;
        }

        .za-photo-filter:hover,
        .za-photo-filter.active {
            background: var(--za-dark);
            border-color: var(--za-dark);

            color: var(--za-accent);
        }


        /* =====================================================
           GALLERY GRID
           ===================================================== */

        .za-photo-grid {
            columns: 3 280px;
            column-gap: 1.25rem;
        }

        .za-photo-item {
            position: relative;

            display: inline-block;

            width: 100%;

            margin: 0 0 1.25rem;

            break-inside: avoid;

            overflow: hidden;

            background: var(--za-surface);

            border: 1px solid rgba(25, 26, 35, .18);
            border-radius: var(--za-radius);

            cursor: zoom-in;

            opacity: 1;
            transform: translateY(0);

            transition:
                opacity .25s,
                transform .25s,
                border-color .25s,
                box-shadow .25s;
        }

        .za-photo-item.hidden {
            display: none;
        }

        .za-photo-item:hover {
            border-color: var(--za-dark);

            transform: translateY(-2px);

            box-shadow:
                0 16px 35px rgba(0, 0, 0, .14);
        }

        .za-photo-item img {
            display: block;

            width: 100%;
            height: auto;

            max-width: none;

            transition: transform .5s ease;
        }

        .za-photo-item:hover img {
            transform: scale(1.025);
        }

        /* subtle watermark overlay */
        .za-photo-watermark {
            position: absolute;

            right: .75rem;
            bottom: .65rem;

            padding: .25rem .45rem;

            background: rgba(25, 26, 35, .55);

            color: rgba(243, 243, 243, .78);

            font-family: 'JetBrains Mono', monospace;
            font-size: .55rem;

            letter-spacing: .12em;

            pointer-events: none;
        }


        /* =====================================================
           IMAGE COUNTER
           ===================================================== */

        .za-photo-count {
            margin-bottom: 1.5rem;

            color: var(--za-text-dim);

            font-family: 'JetBrains Mono', monospace;
            font-size: .7rem;

            letter-spacing: .08em;
            text-transform: uppercase;
        }


        /* =====================================================
           LIGHTBOX
           ===================================================== */

        .za-lightbox {
            position: fixed;
            inset: 0;

            z-index: 1000;

            display: none;
            align-items: center;
            justify-content: center;

            padding: 2rem;

            background: rgba(0, 0, 0, .92);

            opacity: 0;

            transition: opacity .2s;
        }

        .za-lightbox.open {
            display: flex;
            opacity: 1;
        }

        .za-lightbox-image {
            display: block;

            max-width: min(92vw, 1400px);
            max-height: 88vh;

            width: auto;
            height: auto;

            object-fit: contain;

            user-select: none;
            -webkit-user-drag: none;

            box-shadow:
                0 20px 70px rgba(0, 0, 0, .45);
        }

        .za-lightbox-close {
            position: fixed;

            top: 1.5rem;
            right: 1.5rem;

            z-index: 1002;

            display: flex;
            align-items: center;
            justify-content: center;

            width: 42px;
            height: 42px;

            background: var(--za-accent);

            border: 1px solid var(--za-black);
            border-radius: 50%;

            color: var(--za-dark);

            font-size: 1.4rem;
            line-height: 1;

            cursor: pointer;

            transition: all .2s;
        }

        .za-lightbox-close:hover {
            background: var(--za-dark);
            color: var(--za-accent);

            transform: rotate(90deg);
        }

        .za-lightbox-prev,
        .za-lightbox-next {
            position: fixed;

            top: 50%;

            z-index: 1002;

            display: flex;
            align-items: center;
            justify-content: center;

            width: 44px;
            height: 44px;

            transform: translateY(-50%);

            background: rgba(243, 243, 243, .08);

            border: 1px solid rgba(243, 243, 243, .25);
            border-radius: 50%;

            color: var(--za-white);

            font-size: 1.5rem;

            cursor: pointer;

            transition: all .2s;
        }

        .za-lightbox-prev {
            left: 1.5rem;
        }

        .za-lightbox-next {
            right: 1.5rem;
        }

        .za-lightbox-prev:hover,
        .za-lightbox-next:hover {
            background: var(--za-accent);
            border-color: var(--za-accent);

            color: var(--za-dark);
        }

        .za-lightbox-info {
            position: fixed;

            left: 50%;
            bottom: 1.5rem;

            transform: translateX(-50%);

            z-index: 1002;

            color: rgba(243, 243, 243, .65);

            font-family: 'JetBrains Mono', monospace;
            font-size: .65rem;

            letter-spacing: .08em;
            text-transform: uppercase;

            white-space: nowrap;
        }


        /* =====================================================
           FOOTER
           ===================================================== */

        .za-photo-footer {
            padding: 2rem;

            background: var(--za-dark);

            color: var(--za-white);

            text-align: center;
        }

        .za-photo-footer p {
            color: rgba(243, 243, 243, .6);

            font-family: 'JetBrains Mono', monospace;
            font-size: .65rem;

            letter-spacing: .08em;
        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 900px) {

            .za-photo-topbar {
                padding: 1.25rem 1.25rem;
            }

            .za-photo-hero {
                padding: 5.5rem 1.25rem 4rem;
            }

            .za-photo-gallery-section {
                padding: 3rem 1.25rem 5rem;
            }

            .za-photo-grid {
                columns: 2 180px;
                column-gap: .75rem;
            }

            .za-photo-item {
                margin-bottom: .75rem;
            }

            .za-photo-intro {
                font-size: 16px;
                line-height: 1.55;
            }

            .za-lightbox {
                padding: 1rem;
            }

            .za-lightbox-prev,
            .za-lightbox-next {
                width: 38px;
                height: 38px;

                font-size: 1.1rem;
            }

            .za-lightbox-prev {
                left: .75rem;
            }

            .za-lightbox-next {
                right: .75rem;
            }

        }


        @media (max-width: 600px) {

            .za-photo-brand {
                font-size: 1.25rem;
            }

            .za-photo-back {
                padding: .5rem .7rem;
                font-size: .6rem;
            }

            .za-photo-hero {
                padding: 4.5rem 1rem 3rem;
            }

            .za-photo-title {
                font-size: 68px;
            }

            .za-photo-intro {
                font-size: 15px;
            }

            .za-photo-gallery-section {
                padding: 2.5rem 1rem 4rem;
            }

            .za-photo-filters {
                gap: .4rem;

                margin-bottom: 2rem;
            }

            .za-photo-filter {
                padding: .55rem .7rem;

                font-size: .6rem;
            }

            .za-photo-grid {
                columns: 2 130px;
                column-gap: .55rem;
            }

            .za-photo-item {
                margin-bottom: .55rem;
                border-radius: 5px;
            }

            .za-photo-watermark {
                right: .4rem;
                bottom: .4rem;

                font-size: .45rem;
            }

            .za-lightbox-close {
                top: .75rem;
                right: .75rem;

                width: 38px;
                height: 38px;
            }

            .za-lightbox-info {
                bottom: .75rem;

                font-size: .55rem;
            }

        }

    </style>

</head>


<body>

<div class="za-photo-page">


    <!-- =====================================================
         TOP BAR
         ===================================================== -->

    <header class="za-photo-topbar">

        <a href="index.html" class="za-photo-brand">
            ZAYED<span>.</span>ART
        </a>

        <a href="index.html" class="za-photo-back">
            ← Back to Studio
        </a>

    </header>


    <!-- =====================================================
         HERO
         ===================================================== -->

    <section class="za-photo-hero">

        <div class="za-photo-hero-grid"></div>
        <div class="za-photo-hero-glow"></div>

        <div class="za-photo-hero-inner">

            <p class="za-photo-label">
                Visual Archive
            </p>

            <h1 class="za-photo-title">
                PHOTO<br>
                <span>GRAPHY</span>
            </h1>

            <p class="za-photo-intro">
                A visual collection of streets, heritage, architecture,
                and places captured across Egypt and the UAE.
            </p>

        </div>

    </section>


    <!-- =====================================================
         GALLERY
         ===================================================== -->

    <main class="za-photo-gallery-section">

        <div class="za-photo-filters">

            <button
                class="za-photo-filter active"
                data-category="all"
                type="button"
            >
                All
            </button>

            <button
                class="za-photo-filter"
                data-category="alexandria"
                type="button"
            >
                Alexandria
            </button>

            <button
                class="za-photo-filter"
                data-category="cairo"
                type="button"
            >
                Cairo
            </button>

            <button
                class="za-photo-filter"
                data-category="matrouh"
                type="button"
            >
                Matrouh
            </button>

            <button
                class="za-photo-filter"
                data-category="uae"
                type="button"
            >
                UAE
            </button>

        </div>


        <div class="za-photo-count" id="photoCount">
            Loading photographs...
        </div>


        <div
            class="za-photo-grid"
            id="photoGrid"
            aria-live="polite"
        ></div>

    </main>


    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <footer class="za-photo-footer">

        <p>
            © 2026 Zayed.Art — Photography Archive
        </p>

    </footer>

</div>


<!-- =========================================================
     LIGHTBOX
     ========================================================= -->

<div
    class="za-lightbox"
    id="lightbox"
    role="dialog"
    aria-modal="true"
    aria-label="Photography viewer"
>

    <button
        class="za-lightbox-close"
        id="lightboxClose"
        type="button"
        aria-label="Close image"
    >
        ×
    </button>

    <button
        class="za-lightbox-prev"
        id="lightboxPrev"
        type="button"
        aria-label="Previous image"
    >
        ‹
    </button>

    <img
        class="za-lightbox-image"
        id="lightboxImage"
        src=""
        alt=""
        draggable="false"
    >

    <button
        class="za-lightbox-next"
        id="lightboxNext"
        type="button"
        aria-label="Next image"
    >
        ›
    </button>

    <div
        class="za-lightbox-info"
        id="lightboxInfo"
    ></div>

</div>


<!-- =========================================================
     GENERATED PHOTOGRAPHY DATA
     ========================================================= -->

<script src="js/photography.js"></script>


<!-- =========================================================
     PHOTOGRAPHY PAGE SCRIPT
     ========================================================= -->

<script>

    const photoGrid = document.getElementById('photoGrid');
    const photoCount = document.getElementById('photoCount');

    const filters = document.querySelectorAll('.za-photo-filter');

    const lightbox = document.getElementById('lightbox');
    const lightboxImage = document.getElementById('lightboxImage');
    const lightboxInfo = document.getElementById('lightboxInfo');

    const lightboxClose = document.getElementById('lightboxClose');
    const lightboxPrev = document.getElementById('lightboxPrev');
    const lightboxNext = document.getElementById('lightboxNext');


    /* =====================================================
       CATEGORY LABELS
       ===================================================== */

    const categoryNames = {
        alexandria: 'Alexandria',
        cairo: 'Cairo',
        matrouh: 'Matrouh',
        uae: 'UAE'
    };


    /* =====================================================
       BUILD PHOTO LIST
       ===================================================== */

    const allPhotos = [];

    Object.keys(photography).forEach(category => {

        photography[category].forEach(src => {

            allPhotos.push({
                src: src,
                category: category
            });

        });

    });


    /* =====================================================
       RENDER GALLERY
       ===================================================== */

    function renderGallery(category = 'all') {

        photoGrid.innerHTML = '';

        let visiblePhotos;

        if (category === 'all') {

            visiblePhotos = allPhotos;

        } else {

            visiblePhotos = allPhotos.filter(
                photo => photo.category === category
            );

        }


        photoCount.textContent =
            `${visiblePhotos.length} photograph${visiblePhotos.length === 1 ? '' : 's'}`;


        visiblePhotos.forEach((photo, index) => {

            const item = document.createElement('article');

            item.className = 'za-photo-item';

            item.dataset.category = photo.category;


            const image = document.createElement('img');

            image.src = photo.src;

            image.alt =
                `${categoryNames[photo.category] || photo.category} photography`;

            image.loading = 'lazy';

            image.decoding = 'async';

            image.draggable = false;


            const watermark = document.createElement('span');

            watermark.className = 'za-photo-watermark';

            watermark.textContent = 'ZAYED ART';


            item.appendChild(image);
            item.appendChild(watermark);


            item.addEventListener('click', () => {

                openLightbox(
                    visiblePhotos,
                    index
                );

            });


            photoGrid.appendChild(item);

        });

    }


    /* =====================================================
       FILTERS
       ===================================================== */

    filters.forEach(button => {

        button.addEventListener('click', () => {

            filters.forEach(filter => {
                filter.classList.remove('active');
            });

            button.classList.add('active');

            renderGallery(
                button.dataset.category
            );

        });

    });


    /* =====================================================
       LIGHTBOX STATE
       ===================================================== */

    let currentPhotos = [];
    let currentIndex = 0;


    function openLightbox(photos, index) {

        currentPhotos = photos;
        currentIndex = index;

        updateLightbox();

        lightbox.classList.add('open');

        document.body.style.overflow = 'hidden';

    }


    function updateLightbox() {

        const photo = currentPhotos[currentIndex];

        if (!photo) return;


        lightboxImage.src = photo.src;

        lightboxImage.alt =
            `${categoryNames[photo.category] || photo.category} photography`;


        lightboxInfo.textContent =
            `${categoryNames[photo.category] || photo.category} · ${currentIndex + 1} / ${currentPhotos.length}`;

    }


    function closeLightbox() {

        lightbox.classList.remove('open');

        document.body.style.overflow = '';

        setTimeout(() => {

            if (!lightbox.classList.contains('open')) {
                lightboxImage.src = '';
            }

        }, 200);

    }


    function showPrevious() {

        if (!currentPhotos.length) return;

        currentIndex =
            (currentIndex - 1 + currentPhotos.length)
            % currentPhotos.length;

        updateLightbox();

    }


    function showNext() {

        if (!currentPhotos.length) return;

        currentIndex =
            (currentIndex + 1)
            % currentPhotos.length;

        updateLightbox();

    }


    /* =====================================================
       LIGHTBOX CONTROLS
       ===================================================== */

    lightboxClose.addEventListener(
        'click',
        closeLightbox
    );

    lightboxPrev.addEventListener(
        'click',
        showPrevious
    );

    lightboxNext.addEventListener(
        'click',
        showNext
    );


    /* Click outside image */

    lightbox.addEventListener('click', event => {

        if (event.target === lightbox) {
            closeLightbox();
        }

    });


    /* Keyboard controls */

    document.addEventListener('keydown', event => {

        if (!lightbox.classList.contains('open')) {
            return;
        }

        if (event.key === 'Escape') {
            closeLightbox();
        }

        if (event.key === 'ArrowLeft') {
            showPrevious();
        }

        if (event.key === 'ArrowRight') {
            showNext();
        }

    });


    /* =====================================================
       BASIC IMAGE PROTECTION
       ===================================================== */

    document.addEventListener('contextmenu', event => {

        if (
            event.target.tagName === 'IMG' ||
            event.target.closest('.za-photo-item') ||
            event.target.closest('.za-lightbox')
        ) {
            event.preventDefault();
        }

    });


    /* Prevent dragging images */

    document.addEventListener('dragstart', event => {

        if (event.target.tagName === 'IMG') {
            event.preventDefault();
        }

    });


    /* =====================================================
       INITIAL LOAD
       ===================================================== */

    renderGallery();

</script>


</body>
</html>
