<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Photography — Zayed Art</title>

    <meta
        name="description"
        content="A visual archive of street photography, heritage, architecture, and places across Egypt and the UAE by Zayed Art."
    >

    <meta
        name="keywords"
        content="Zayed Art, Photography, Street Photography, Alexandria, Cairo, Matrouh, UAE"
    >

    <meta name="author" content="Zayed Art">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Main Website CSS -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/photography.css">

    <!-- Language -->
    <script src="js/lang.js"></script>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

</head>


<body>

<div class="za-photo-page">


    <!-- =====================================================
         TOP BAR
         ===================================================== -->

    <header class="za-photo-topbar">

        <a href="index.html" class="za-photo-brand">
            ZAYED<span>.</span>ART
        </a>

        <a
            href="index.html"
            class="za-photo-back"
            data-i18n="pgBack"
        >
            ← Back to Studio
        </a>

    </header>


    <!-- =====================================================
         HERO
         ===================================================== -->

    <section class="za-photo-hero">

        <div class="za-photo-hero-grid"></div>
        <div class="za-photo-hero-glow"></div>

        <div class="za-photo-hero-inner">

            <p
                class="za-photo-label"
                data-i18n="pgLabel"
            >
                Visual Archive
            </p>

            <h1
                class="za-photo-title"
                data-i18n="pgTitle"
            >
                PHOTO<br>
                <span>GRAPHY</span>
            </h1>

            <p
                class="za-photo-intro"
                data-i18n="pgIntro"
            >
                A visual collection of streets, heritage, architecture,
                and places captured across Egypt and the UAE.
            </p>

            <div class="za-photo-language">
                <button
                    onclick="toggleLanguage()"
                    class="za-lang-btn"
                >
                    EN / عربي
                </button>
            </div>

        </div>

    </section>


    <!-- =====================================================
         GALLERY
         ===================================================== -->

    <main class="za-photo-gallery-section">

        <div class="za-photo-filters">

            <button
                class="za-photo-filter active"
                data-category="all"
                type="button"
                data-i18n="pgFilterAll"
            >
                All
            </button>

            <button
                class="za-photo-filter"
                data-category="alexandria"
                type="button"
                data-i18n="pgFilterAlexandria"
            >
                Alexandria
            </button>

            <button
                class="za-photo-filter"
                data-category="cairo"
                type="button"
                data-i18n="pgFilterCairo"
            >
                Cairo
            </button>

            <button
                class="za-photo-filter"
                data-category="matrouh"
                type="button"
                data-i18n="pgFilterMatrouh"
            >
                Matrouh
            </button>

            <button
                class="za-photo-filter"
                data-category="uae"
                type="button"
                data-i18n="pgFilterUAE"
            >
                UAE
            </button>

        </div>


        <div
            class="za-photo-count"
            id="photoCount"
            data-i18n="pgLoading"
        >
            Loading photographs...
        </div>


        <div
            class="za-photo-grid"
            id="photoGrid"
            aria-live="polite"
        ></div>

    </main>


    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <footer class="za-photo-footer">

        <p data-i18n="pgFooter">
            © 2026 Zayed.Art — Photography Archive
        </p>

    </footer>

</div>


<!-- =========================================================
     LIGHTBOX
     ========================================================= -->

<div
    class="za-lightbox"
    id="lightbox"
    role="dialog"
    aria-modal="true"
    aria-label="Photography viewer"
>

    <button
        class="za-lightbox-close"
        id="lightboxClose"
        type="button"
        aria-label="Close image"
    >
        ×
    </button>

    <button
        class="za-lightbox-prev"
        id="lightboxPrev"
        type="button"
        aria-label="Previous image"
    >
        ‹
    </button>

    <img
        class="za-lightbox-image"
        id="lightboxImage"
        src=""
        alt=""
        draggable="false"
    >

    <button
        class="za-lightbox-next"
        id="lightboxNext"
        type="button"
        aria-label="Next image"
    >
        ›
    </button>

    <div
        class="za-lightbox-info"
        id="lightboxInfo"
    ></div>

</div>


<!-- =========================================================
     GENERATED PHOTOGRAPHY DATA
     ========================================================= -->

<script src="js/photography.js"></script>


<!-- =========================================================
     PHOTOGRAPHY PAGE SCRIPT
     ========================================================= -->

<script>

    const photoGrid = document.getElementById('photoGrid');
    const photoCount = document.getElementById('photoCount');

    const filters = document.querySelectorAll('.za-photo-filter');

    const lightbox = document.getElementById('lightbox');
    const lightboxImage = document.getElementById('lightboxImage');
    const lightboxInfo = document.getElementById('lightboxInfo');

    const lightboxClose = document.getElementById('lightboxClose');
    const lightboxPrev = document.getElementById('lightboxPrev');
    const lightboxNext = document.getElementById('lightboxNext');


    /* =====================================================
       CATEGORY LABELS
       ===================================================== */

    const categoryNamesByLang = {
        en: {
            alexandria: 'Alexandria',
            cairo: 'Cairo',
            matrouh: 'Matrouh',
            uae: 'UAE'
        },

        ar: {
            alexandria: 'الإسكندرية',
            cairo: 'القاهرة',
            matrouh: 'مطروح',
            uae: 'الإمارات'
        }
    };


    function getCategoryNames() {

        return (
            categoryNamesByLang[
                document.documentElement.lang
            ] ||
            categoryNamesByLang.en
        );

    }


    function buildCountText(n) {

        if (document.documentElement.lang === 'ar') {
            return `${n} صورة`;
        }

        return `${n} photograph${n === 1 ? '' : 's'}`;

    }


    /* =====================================================
       BUILD PHOTO LIST
       ===================================================== */

    const allPhotos = [];

    Object.keys(photography).forEach(category => {

        photography[category].forEach(src => {

            allPhotos.push({
                src: src,
                category: category
            });

        });

    });


    /* =====================================================
       RENDER GALLERY
       ===================================================== */

    function renderGallery(category = 'all') {

        photoGrid.innerHTML = '';

        let visiblePhotos;

        if (category === 'all') {

            visiblePhotos = allPhotos;

        } else {

            visiblePhotos = allPhotos.filter(
                photo => photo.category === category
            );

        }


        photoCount.textContent =
            buildCountText(visiblePhotos.length);


        visiblePhotos.forEach((photo, index) => {

            const item = document.createElement('article');

            item.className = 'za-photo-item';

            item.dataset.category = photo.category;


            const image = document.createElement('img');

            image.src = photo.src;

            image.alt =
                `${getCategoryNames()[photo.category] || photo.category} photography`;

            image.loading = 'lazy';

            image.decoding = 'async';

            image.draggable = false;


            const watermark = document.createElement('span');

            watermark.className = 'za-photo-watermark';

            watermark.textContent = 'ZAYED ART';


            item.appendChild(image);
            item.appendChild(watermark);


            item.addEventListener('click', () => {

                openLightbox(
                    visiblePhotos,
                    index
                );

            });


            photoGrid.appendChild(item);

        });

    }


    /* =====================================================
       FILTERS
       ===================================================== */

    filters.forEach(button => {

        button.addEventListener('click', () => {

            filters.forEach(filter => {
                filter.classList.remove('active');
            });

            button.classList.add('active');

            renderGallery(
                button.dataset.category
            );

        });

    });


    /* =====================================================
       LIGHTBOX STATE
       ===================================================== */

    let currentPhotos = [];
    let currentIndex = 0;


    function openLightbox(photos, index) {

        currentPhotos = photos;
        currentIndex = index;

        updateLightbox();

        lightbox.classList.add('open');

        document.body.style.overflow = 'hidden';

    }


    function updateLightbox() {

        const photo = currentPhotos[currentIndex];

        if (!photo) return;


        lightboxImage.src = photo.src;

        lightboxImage.alt =
            `${getCategoryNames()[photo.category] || photo.category} photography`;


        lightboxInfo.textContent =
            `${getCategoryNames()[photo.category] || photo.category} · ${currentIndex + 1} / ${currentPhotos.length}`;

    }


    function closeLightbox() {

        lightbox.classList.remove('open');

        document.body.style.overflow = '';

        setTimeout(() => {

            if (!lightbox.classList.contains('open')) {
                lightboxImage.src = '';
            }

        }, 200);

    }


    function showPrevious() {

        if (!currentPhotos.length) return;

        currentIndex =
            (currentIndex - 1 + currentPhotos.length)
            % currentPhotos.length;

        updateLightbox();

    }


    function showNext() {

        if (!currentPhotos.length) return;

        currentIndex =
            (currentIndex + 1)
            % currentPhotos.length;

        updateLightbox();

    }


    /* =====================================================
       LANGUAGE
       ===================================================== */

    function toggleLanguage() {

        const newLang =
            document.documentElement.lang === 'ar'
                ? 'en'
                : 'ar';

        setLanguage(newLang);


        const activeFilter =
            document.querySelector(
                '.za-photo-filter.active'
            );


        renderGallery(
            activeFilter
                ? activeFilter.dataset.category
                : 'all'
        );


        if (lightbox.classList.contains('open')) {
            updateLightbox();
        }

    }


    /* =====================================================
       LIGHTBOX CONTROLS
       ===================================================== */

    lightboxClose.addEventListener(
        'click',
        closeLightbox
    );

    lightboxPrev.addEventListener(
        'click',
        showPrevious
    );

    lightboxNext.addEventListener(
        'click',
        showNext
    );


    /* Click outside image */

    lightbox.addEventListener('click', event => {

        if (event.target === lightbox) {
            closeLightbox();
        }

    });


    /* Keyboard controls */

    document.addEventListener('keydown', event => {

        if (!lightbox.classList.contains('open')) {
            return;
        }

        if (event.key === 'Escape') {
            closeLightbox();
        }

        if (event.key === 'ArrowLeft') {
            showPrevious();
        }

        if (event.key === 'ArrowRight') {
            showNext();
        }

    });


    /* =====================================================
       BASIC IMAGE PROTECTION
       ===================================================== */

    document.addEventListener('contextmenu', event => {

        if (
            event.target.tagName === 'IMG' ||
            event.target.closest('.za-photo-item') ||
            event.target.closest('.za-lightbox')
        ) {
            event.preventDefault();
        }

    });


    /* Prevent dragging images */

    document.addEventListener('dragstart', event => {

        if (event.target.tagName === 'IMG') {
            event.preventDefault();
        }

    });


    /* =====================================================
       INITIAL LOAD
       ===================================================== */

    renderGallery();

</script>


</body>
</html>
