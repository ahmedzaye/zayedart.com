name: Generate Photography Data

on:
  push:
    paths:
      - 'assets/photography/**'
      - '.github/workflows/photography.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-photography-js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate photography.js
        shell: bash
        run: |
          mkdir -p js

          {
            echo "/*"
            echo " * AUTO-GENERATED FILE"
            echo " * Do not edit manually."
            echo " * Generated by GitHub Actions."
            echo " */"
            echo ""
            echo "const photography = {"

            first_category=true

            for dir in assets/photography/*/; do
              [ -d "$dir" ] || continue

              category=$(basename "$dir")

              if [ "$first_category" = true ]; then
                first_category=false
              else
                echo ","
              fi

              echo "  \"$category\": ["

              first_image=true

              while IFS= read -r -d '' file; do
                filename="${file#./}"
                encoded_path=$(python3 -c 'import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe="/:@-._~"))' "$filename")

                if [ "$first_image" = true ]; then
                  first_image=false
                else
                  echo ","
                fi

                printf '    "/%s"' "$encoded_path"

              done < <(
                find "$dir" -type f \
                  \( -iname "*.webp" -o -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \) \
                  -print0 2>/dev/null | sort -z
              )

              echo ""
              echo "  ]"
            done

            echo "};"
          } > js/photography.js

      - name: Commit generated file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add js/photography.js

          if git diff --cached --quiet; then
            echo "No changes to photography.js"
          else
            git commit -m "chore: update photography index"
            git push
          fi