name: Validate photography data

on:
  push:
    paths:
      - 'data/photography.json'
      - 'assets/photography/**'
      - 'scripts/validate-photography.mjs'
  pull_request:
    paths:
      - 'data/photography.json'
      - 'assets/photography/**'
      - 'scripts/validate-photography.mjs'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-photography.mjs
